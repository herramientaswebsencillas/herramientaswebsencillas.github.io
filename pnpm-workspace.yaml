# Configuración de pnpm. Desde pnpm 11 estos ajustes ya no se leen del campo
# "pnpm" de package.json, aunque el proyecto no sea un monorepo.

# No se instalan versiones publicadas hace menos de 3 días (en minutos). La
# mayoría de los paquetes comprometidos en npm se detectan y retiran en ese
# plazo, y cada push a main se publica solo. Complementa el cooldown de
# .github/dependabot.yml y cubre también los `pnpm add` y `pnpm update` hechos a
# mano. Si un aviso de seguridad obliga a adoptar una versión más nueva, se
# añade a minimumReleaseAgeExclude con el aviso en un comentario.
minimumReleaseAge: 4320

# Versiones forzadas de dependencias transitivas con avisos de seguridad.
# Cada una con el aviso y el camino por el que llega; se quita cuando la
# dependencia que la trae ya pide una versión corregida.
overrides:
  # GHSA-g3hv-75wg-m249. Llega vía eslint-config-next (@typescript-eslint/
  # typescript-estree pide minimatch 10). La rama 3.x no está afectada y se
  # queda como está. Quitar cuando typescript-estree pida minimatch 11.
  minimatch@>=7.0.0 <11.0.1: ^11.0.1

# pnpm bloquea por defecto los scripts de instalación y exige decidir uno a uno.
# unrs-resolver compila el binario que usa el resolver de eslint-config-next.
# sharp solo hace falta para optimizar imágenes, y este sitio se exporta
# estático con images.unoptimized, así que no se compila.
allowBuilds:
  sharp: false
  unrs-resolver: true
