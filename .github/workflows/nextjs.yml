# Verifica y despliega el sitio en GitHub Pages.
#
# En cada pull request se ejecutan las verificaciones (lint, auditoría de
# dependencias, pruebas, build y pruebas de humo) sin desplegar. En cada push
# a main se ejecuta lo mismo y, si todo pasa, se publica out/ en Pages.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Permite lanzarlo a mano desde la pestaña Actions (también sirve para
  # volver a publicar un commit anterior; ver "Rollback" en el README).
  workflow_dispatch:

# El build solo necesita leer el repositorio; los permisos de Pages se dan
# únicamente al job de despliegue.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Debe ir antes de setup-node: la caché de pnpm necesita el binario ya
      # disponible. La versión sale del campo "packageManager" de package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # La misma versión que en local; pnpm 11 exige Node >= 22.13.
          node-version-file: .nvmrc
          cache: pnpm
      # Sin static_site_generator: esa opción busca next.config.js, no encuentra
      # next.config.ts y crea uno vacío que Next usa en su lugar, así que la
      # configuración del proyecto se ignoraba. next.config.ts ya define todo
      # lo que Pages necesita (output: 'export', basePath, images.unoptimized).
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint --max-warnings=0
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Unit tests
        run: pnpm test
      # next build también comprueba los tipos de TypeScript.
      - name: Build with Next.js
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke tests
        run: pnpm test:e2e
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
