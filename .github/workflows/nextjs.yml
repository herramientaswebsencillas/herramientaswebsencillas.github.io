# Verifica y despliega el sitio en GitHub Pages.
#
# En cada pull request se ejecutan las verificaciones (lint, auditoría de
# dependencias, pruebas, build y pruebas de humo) sin desplegar. En cada push
# a main se ejecuta lo mismo y, si todo pasa, se publica out/ en Pages.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Permite lanzarlo a mano desde la pestaña Actions (también sirve para
  # volver a publicar un commit anterior; ver "Rollback" en el README).
  workflow_dispatch:

# El build solo necesita leer el repositorio; los permisos de Pages se dan
# únicamente al job de despliegue.
#
# Las acciones se fijan por SHA (con la versión en un comentario) y no por
# etiqueta: una etiqueta se puede mover, y el job build genera lo que se
# publica. Dependabot actualiza los SHA junto con el comentario.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Debe ir antes de setup-node: la caché de pnpm necesita el binario ya
      # disponible. La versión sale del campo "packageManager" de package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # La misma versión que en local; pnpm 11 exige Node >= 22.13.
          node-version-file: .nvmrc
          cache: pnpm
      # Sin static_site_generator: esa opción busca next.config.js, no encuentra
      # next.config.ts y crea uno vacío que Next usa en su lugar, así que la
      # configuración del proyecto se ignoraba. next.config.ts ya define todo
      # lo que Pages necesita (output: 'export', basePath, images.unoptimized).
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Restore cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint --max-warnings=0
      - name: Check formatting
        run: pnpm format:check
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Unit tests
        run: pnpm test
      # next build también comprueba los tipos de TypeScript.
      - name: Build with Next.js
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke tests
        run: pnpm test:e2e
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Inventario de dependencias (SBOM) de cada versión publicada, en formato
  # CycloneDX. Syft lo arma leyendo pnpm-lock.yaml. Va en un job aparte para
  # que la acción de terceros no corra donde se genera el sitio. El archivo
  # queda como artefacto de la ejecución (pestaña Actions).
  sbom:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-${{ github.sha }}.cdx.json
