# Prepara pnpm, Node y las dependencias igual en todos los jobs, para que un
# cambio (versión de Node, flags de instalación) no se olvide en ninguno. El
# checkout va antes, en cada job: GitHub necesita el repositorio para
# encontrar esta acción.
#
# Las acciones se fijan por SHA, como en los workflows; Dependabot también las
# actualiza aquí (ver "directories" en .github/dependabot.yml).
name: Setup
description: Instala pnpm y Node (versión de .nvmrc) y, si se pide, las dependencias.

inputs:
  install:
    description: "Instalar las dependencias con --frozen-lockfile"
    default: "true"

runs:
  using: composite
  steps:
    # Debe ir antes de setup-node: la caché de pnpm necesita el binario ya
    # disponible. La versión sale del campo "packageManager" de package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # La misma versión que en local.
        node-version-file: .nvmrc
        # Sin instalación no hay nada que guardar en caché.
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
